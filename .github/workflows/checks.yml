name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.test.js tests/theme.test.js tests/content.test.js tests/badges.test.js tests/pyramids.test.js
      - run: node --check untappd-atlas/assets/dashboard.js
      - run: node --check untappd-atlas/assets/export.js
      - run: node --check untappd-atlas/assets/theme.js
      - run: node --check untappd-atlas/assets/content.js
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find untappd-atlas tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l untappd-atlas.php && php -l uninstall.php
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/build-package.py
      - run: python3 -m zipfile -t test-artifacts/untappd-atlas-1.6.1.zip
